[project]
name = "fornacis"
version = "0.1.0"
description = "Asynchronous serverless data export from Snowflake to S3"
authors = [
    { name = "Vitaliy Boyarsky", email = "boyarsky.vitaliy@live.com" },
]
readme = "readme.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.20",
    "isort==6.1.0",
    "setuptools==70.2.0",
]

[tool.isort]
line_length = 120
multi_line_output = 5
include_trailing_comma = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fornacis"]